apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: phaselock-gateway-validating-webhook
webhooks:
  - name: vphaselockgateways.platform.phaselock.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["platform.phaselock.io"]
        apiVersions: ["v1alpha1"]
        resources: ["phaselockgateways"]
    clientConfig:
      service:
        namespace: phaselock-system
        name: phaselock-operator-webhook
        path: /validate-platform-phaselock-io-v1alpha1-phaselockgateway
      caBundle: ""
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: phaselockgateways.platform.phaselock.io
spec:
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions: ["v1"]
      clientConfig:
        service:
          namespace: phaselock-system
          name: phaselock-operator-webhook
          path: /convert-platform-phaselock-io
        caBundle: ""
